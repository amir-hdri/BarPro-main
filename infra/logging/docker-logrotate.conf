# Logrotate Configuration for BarPro in Docker Containers
# This configuration is optimized for containerized environments

# Backend application logs
/var/log/barpro/backend/app.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
    postrotate
        # Signal the application to reopen log files
        kill -HUP 1 2>/dev/null || true
    endscript
}

# Uvicorn access logs
/var/log/barpro/backend/access.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
}

# Uvicorn error logs
/var/log/barpro/backend/error.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
}

# Celery worker logs
/var/log/barpro/celery/worker.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
}

# Celery beat scheduler logs
/var/log/barpro/celery/beat.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
}

# RPA automation logs
/var/log/barpro/rpa/automation.log {
    hourly
    missingok
    rotate 24
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
}

# RPA debug logs (captcha, browser, etc.)
/var/log/barpro/rpa/debug.log {
    hourly
    missingok
    rotate 12
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    maxsize 100M
    sharedscripts
}

# Audit logs (keep longer)
/var/log/barpro/audit.log {
    daily
    missingok
    rotate 90
    compress
    delaycompress
    notifempty
    create 640 appuser appuser
    sharedscripts
}
