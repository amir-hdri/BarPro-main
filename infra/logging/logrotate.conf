# Logrotate Configuration for BarPro Application
# This file should be placed in /etc/logrotate.d/barpro on production servers
# Or used as a reference for container-based logging

# Application logs
/var/log/barpro/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
    postrotate
        /usr/bin/systemctl reload barpro 2>/dev/null || true
    endscript
}

# Backend logs (FastAPI/Uvicorn)
/var/log/barpro/backend/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
    postrotate
        /usr/bin/systemctl reload barpro-backend 2>/dev/null || /usr/bin/docker exec barpro-backend kill -HUP 1 2>/dev/null || true
    endscript
}

# Frontend logs (Next.js)
/var/log/barpro/frontend/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 644 node node
    sharedscripts
    postrotate
        /usr/bin/systemctl reload barpro-frontend 2>/dev/null || /usr/bin/docker exec barpro-frontend kill -HUP 1 2>/dev/null || true
    endscript
}

# Celery worker logs
/var/log/barpro/celery/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
    postrotate
        /usr/bin/systemctl reload barpro-celery 2>/dev/null || /usr/bin/docker exec barpro-celery kill -HUP 1 2>/dev/null || true
    endscript
}

# RPA Automation logs
/var/log/barpro/rpa/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    sharedscripts
}

# Nginx logs
/var/log/nginx/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 644 www-data adm
    sharedscripts
    postrotate
        /usr/bin/systemctl reload nginx 2>/dev/null || /usr/bin/docker exec barpro-nginx nginx -s reload 2>/dev/null || true
    endscript
}

# System/Access logs
/var/log/barpro/access.log {
    daily
    missingok
    rotate 90
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
}

# Error logs (keep longer for debugging)
/var/log/barpro/error.log {
    daily
    missingok
    rotate 90
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
}
