# ── تنظیمات مشترک HTTP/HTTPS ──────────────────────────────────
# این فایل توسط هر دو بلوک server (HTTP و HTTPS) include می‌شود

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-XSS-Protection "1; mode=block" always;

client_max_body_size 50m;
limit_conn conn_limit_per_ip 50;

location /ws/ {
  limit_req zone=tenant_ratelimit burst=20 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  set $backend_target "http://backend:8000";
  proxy_pass $backend_target;
}

location /backend/ {
  limit_req zone=tenant_ratelimit burst=30 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  rewrite ^/backend/(.*)$ /$1 break;
  set $backend_target "http://backend:8000";
  proxy_pass $backend_target;
}

location ~ ^/api/(v1/)?healthz$ {
  limit_req zone=tenant_ratelimit burst=30 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  rewrite ^/api/(v1/)?healthz$ /healthz break;
  set $backend_target "http://backend:8000";
  proxy_pass $backend_target;
}

location ~ ^/api/v1/(.*) {
  limit_req zone=tenant_ratelimit burst=30 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_read_timeout 300;
  proxy_connect_timeout 300;
  set $backend_target "http://backend:8000";
  proxy_pass $backend_target;
}

location ~ ^/(api|management|waybill|healthz|readyz|events|workers|auth-config|captcha|browser-pool|security|errors|ui|assets)(/.*|$) {
  limit_req zone=tenant_ratelimit burst=30 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  set $backend_target "http://backend:8000";
  proxy_pass $backend_target;
}

location /metrics {
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  allow 127.0.0.1;
  allow 172.16.0.0/12;
  deny all;
  set $backend_target "http://backend:8000/metrics";
  proxy_pass $backend_target;
}

location /stub_status {
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  stub_status on;
  allow 127.0.0.1;
  allow 172.16.0.0/12;
  deny all;
}

location / {
  limit_req zone=public_ratelimit burst=60 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  set $frontend_target "http://frontend:3000";
  proxy_pass $frontend_target;
}
