# ── تنظیمات مشترک HTTP/HTTPS ──────────────────────────────────
# این فایل توسط هر دو بلوک server (HTTP و HTTPS) include می‌شود

# H6 fix: security headers live in a shared include. nginx cancels server-level
# add_header inheritance for any location that declares its OWN add_header, so
# every such location must `include /etc/nginx/security-headers.conf;` explicitly.
include /etc/nginx/security-headers.conf;

client_max_body_size 10m;
limit_conn conn_limit_per_ip 50;

# Upstream variables for dynamic DNS resolution in Docker
# Using variables forces nginx to re-resolve container names on each request
# This is essential for Docker environments where containers may be recreated with new IPs
set $backend_upstream http://backend:8000;
set $frontend_upstream http://frontend:3000;

location /ws/ {
  limit_req zone=tenant_ratelimit burst=20 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_pass $backend_upstream;
}

location = /backend {
  return 404;
}

location ^~ /backend/ {
  return 404;
}

location ~ ^/api/(v1/)?healthz$ {
  limit_req zone=tenant_ratelimit burst=30 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  rewrite ^/api/(v1/)?healthz$ /healthz break;
  proxy_pass $backend_upstream;
}

location ~ ^/api/v1/(.*) {
  limit_req zone=tenant_ratelimit burst=30 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_read_timeout 300;
  proxy_connect_timeout 300;
  proxy_pass $backend_upstream;
}

location ~ ^/(api|management|waybill|healthz|readyz|events|workers|auth-config|captcha|browser-pool|security|errors|ui|assets|proxies|circuit-breaker)(/.*|$) {
  limit_req zone=tenant_ratelimit burst=30 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_pass $backend_upstream;
}

location /metrics {
  include /etc/nginx/security-headers.conf;
  proxy_set_header X-Request-Id $request_id;
  allow 127.0.0.1;
  allow 172.16.0.0/12;
  deny all;
  proxy_pass $backend_upstream;
}

# Alertmanager webhook: internal-only at the edge. Alertmanager calls the
# backend directly over the Docker network; public callers must never reach
# this endpoint (fail-closed is also enforced app-side via X-Request-ID).
location = /api/v1/admin/alerts/webhook {
  include /etc/nginx/security-headers.conf;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  allow 127.0.0.1;
  allow 172.16.0.0/12;
  deny all;
  proxy_pass $backend_upstream;
}

location /stub_status {
  include /etc/nginx/security-headers.conf;
  stub_status on;
  allow 127.0.0.1;
  allow 172.16.0.0/12;
  deny all;
}

location = /service-worker.js {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  include /etc/nginx/security-headers.conf;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  proxy_pass $frontend_upstream;
}

location /_next/static/ {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  include /etc/nginx/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  proxy_pass $frontend_upstream;
}

location / {
  limit_req zone=public_ratelimit burst=60 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  include /etc/nginx/security-headers.conf;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  proxy_pass $frontend_upstream;
}
