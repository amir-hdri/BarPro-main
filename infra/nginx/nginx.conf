worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;
  server_tokens off;

  # ── فشرده‌سازی gzip ──────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml image/svg+xml;

  # ── شناسایی IP واقعی کاربر ──────────────────────────────────
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;

  # ── بافرینگ Proxy ────────────────────────────────────────────
  proxy_buffer_size   16k;
  proxy_buffers       4 32k;
  proxy_busy_buffers_size 64k;
  proxy_connect_timeout   30s;
  proxy_send_timeout      60s;
  proxy_read_timeout      120s;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","http_referrer":"$http_referer","http_user_agent":"$http_user_agent"}';

  access_log /var/log/nginx/access.log json_combined;
  error_log /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=public_ratelimit:20m rate=25r/s;
  limit_req_zone $http_authorization zone=tenant_ratelimit:20m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:20m;

  upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
  }

  upstream backend_upstream {
    server backend:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 50m;
    limit_conn conn_limit_per_ip 50;

    location /ws/ {
      limit_req zone=tenant_ratelimit burst=20 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://backend_upstream;
    }

    location ~ ^/(api|admin|management|reports|user|waybill|healthz|readyz|events|workers|auth-config|captcha|browser-pool|security|errors|ui|assets)(/.*|$) {
      limit_req zone=tenant_ratelimit burst=30 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://backend_upstream;
    }

    location /metrics {
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      deny all;
      proxy_pass http://backend_upstream/metrics;
    }

    location / {
      limit_req zone=public_ratelimit burst=60 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://frontend_upstream;
    }
  }
}
