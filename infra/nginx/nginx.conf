worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;
  server_tokens off;

  # ── فشرده‌سازی gzip ──────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml image/svg+xml;

  # ── شناسایی IP واقعی کاربر ──────────────────────────────────
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;

  # ── Rate Limiting Map ─────────────────────────────────────────
  map $http_authorization $tenant_limit_key {
    default $http_authorization;
    ""      $binary_remote_addr;
  }

  # ── بافرینگ Proxy ────────────────────────────────────────────
  proxy_buffer_size   16k;
  proxy_buffers       4 32k;
  proxy_busy_buffers_size 64k;
  proxy_connect_timeout   30s;
  proxy_send_timeout      60s;
  proxy_read_timeout      120s;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","http_referrer":"$http_referer","http_user_agent":"$http_user_agent"}';

  access_log /var/log/nginx/access.log json_combined;
  error_log /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=public_ratelimit:10m rate=25r/s;
  limit_req_zone $tenant_limit_key zone=tenant_ratelimit:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

  resolver 127.0.0.11 ipv6=off valid=30s;

  upstream frontend_upstream {
    zone frontend 64k;
    server frontend:3000 resolve;
    keepalive 32;
  }

  upstream backend_upstream {
    zone backend 64k;
    server backend:8000 resolve max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ── HTTP — فقط ریدایرکت به HTTPS ──────────────────────────────
  server {
    listen 80;
    server_name _;

    # بعد از نصب گواهی: خط زیر را uncomment کنید تا HTTP→HTTPS 301 فعال شود
    # return 301 https://$host$request_uri;

    # تا زمان نصب گواهی، همان HTTP سرویس می‌دهد
    include /etc/nginx/http-server.conf;
  }

  # ── HTTPS — بعد از نصب گواهی فعال کنید ───────────────────────
  # server {
  #   listen 443 ssl http2;
  #   server_name _;
  #
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers on;
  #   ssl_session_cache shared:SSL:50m;
  #   ssl_session_timeout 1d;
  #   ssl_session_tickets off;
  #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  #
  #   include /etc/nginx/http-server.conf;
  # }
}
