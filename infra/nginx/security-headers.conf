# ── Security headers (shared) ────────────────────────────────────────────────
# H6 fix: nginx cancels server-level add_header inheritance for ANY location
# that declares its own add_header. Every location that sets e.g. Cache-Control
# must include this file, otherwise it serves responses WITHOUT CSP /
# X-Frame-Options / nosniff etc.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
