global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']

  # nginx مستقیماً قابل اسکرپ توسط Prometheus نیست (stub_status فرمت Prometheus ندارد)
  # برای مانیتورینگ nginx از لاگ‌های Nginx استفاده کنید یا nginx-prometheus-exporter اضافه کنید
  # - job_name: 'nginx'
  #   metrics_path: /stub_status
  #   static_configs:
  #     - targets: ['nginx:80']
