global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      5s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['barpro-alertmanager:9093']

scrape_configs:
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['barpro-alertmanager:9093']

  # ── Exporters (محلی) ─────────────────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']   # node-exporter داخل شبکه barpro_platform (پورت عمومی ندارد)

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nginx'
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx-exporter:9113']


  # nginx مستقیماً قابل اسکرپ توسط Prometheus نیست (stub_status فرمت Prometheus ندارد)
  # برای مانیتورینگ nginx از لاگ‌های Nginx استفاده کنید یا nginx-prometheus-exporter اضافه کنید
