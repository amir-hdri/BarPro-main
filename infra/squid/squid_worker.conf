# Squid proxy configuration for Remote Worker Node
# =================================================
# This config is used by compose/worker-node.yml on each remote Worker server.
#
# The key setting is tcp_outgoing_address which binds outgoing connections
# to the Worker server's own IP — this is what gives each Worker a distinct
# egress IP when connecting to UTCMS.
#
# Set WORKER_EGRESS_IP in the Worker's environment and substitute before use:
#   sed "s/__WORKER_EGRESS_IP__/${WORKER_EGRESS_IP}/" squid_worker.conf > /etc/squid/squid.conf

http_port 3128

# Access control — allow only from Docker containers on this host
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10
acl localhost src 127.0.0.1/32
# The Central server performs /api/system/proxies/health checks THROUGH this
# proxy (source IP = Central's public IP). Replace __CENTRAL_IP__ with the
# Central server's public IP, or the health checks will report this worker as
# "dead" even though it works fine.
acl central src __CENTRAL_IP__

http_access allow localnet
http_access allow localhost
http_access allow central
http_access deny all

# Bind outgoing connections to the Worker server's public IP.
# This ensures UTCMS sees the Worker's IP, not the Central server's IP.
# Replace __WORKER_EGRESS_IP__ with the actual Worker VPS public IP.
tcp_outgoing_address __WORKER_EGRESS_IP__

# Disable caching (this is a scraping proxy, not a web cache)
cache deny all

# Performance tuning
pipeline_prefetch off
forwarded_for delete

# Prefer IPv4 DNS and connections (essential for environments without IPv6 routes)
dns_v4_first on

