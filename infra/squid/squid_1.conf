# Squid proxy configuration for IP 1
http_port 3128

# Access control
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

http_access allow localnet
http_access allow localhost
http_access deny all

# NOTE: tcp_outgoing_address is commented out for local development.
# On production server, uncomment and set to 188.121.123.16 to bind egress to specific IP.
# tcp_outgoing_address 188.121.123.16

# Disable caching for scraping proxy
cache deny all

