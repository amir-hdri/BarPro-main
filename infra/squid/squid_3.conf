# Squid proxy configuration for IP 3
http_port 3130

# Access control - Restricted to Docker bridge network and localhost only
acl docker_bridge src 172.20.0.0/16
acl localhost src 127.0.0.1/32 ::1/128

http_access allow docker_bridge
http_access allow localhost
http_access deny all

# NOTE: tcp_outgoing_address is commented out for local development.
# On production server, uncomment and set to your actual public IP
# to bind egress to a specific IP (e.g., <SECONDARY_EGRESS_IP>).
# tcp_outgoing_address <SECONDARY_EGRESS_IP>

# Disable caching for scraping proxy
cache deny all

