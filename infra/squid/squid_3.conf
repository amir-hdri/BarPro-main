# Squid proxy configuration for IP 3
http_port 3130

# Access control - Restricted to Docker bridge network and localhost only
acl docker_bridge src 172.20.0.0/16
acl localhost src 127.0.0.1/32 ::1/128

http_access allow docker_bridge
http_access allow localhost
http_access deny all

# Egress binding — commented out for local development (safe default).
# On production, the deploy script uncomments this line and substitutes
# __EGRESS_IP__ with the server's public IP so Squid egress uses THIS IP
# (one-IP-per-worker). The previous "<SECONDARY_EGRESS_IP>" placeholder could
# never be substituted because it lived inside a comment (X3).
# tcp_outgoing_address __EGRESS_IP__

# Disable caching for scraping proxy
cache deny all

