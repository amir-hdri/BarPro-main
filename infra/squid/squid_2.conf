# Squid proxy configuration for IP 2
http_port 3128

# Access control
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

http_access allow localnet
http_access allow localhost
http_access deny all

# Bind outgoing traffic to the specific IP address
# REPLACE "IP_ADDRESS_2" with the actual static IP 2 of your server
tcp_outgoing_address IP_ADDRESS_2

# Disable caching for scraping proxy
cache deny all
