version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: utcms_rpa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    shm_size: '2gb'
    image: node:20-bookworm
    working_dir: /workspace/apps/backend
    command: sh -c "npm install && npm run prisma:generate && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/utcms_rpa?schema=public
      REDIS_URL: redis://redis:6379
      LEGACY_LOGIN_URL: https://example.com/login
      LEGACY_SUBMIT_URL: https://example.com/submit
      HEALTHCHECK_URL: https://example.com/login
    volumes:
      - ./:/workspace
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
