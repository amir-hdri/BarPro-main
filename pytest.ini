[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    asyncio: marks tests as async tests
# Warnings are errors, configured here rather than via `pytest -W error` on the
# CI command line.
#
# Why this moved: `-W error` was passed in three workflow steps (ci-cd.yml,
# ci-test.yml unit + integration). Command-line -W filters are applied after the
# ini ones and therefore outrank them, so the ignore entries below were dead in
# CI and there was no way to grant a narrow exemption for a third-party
# deprecation — the only options were "whole suite red" or "drop -W error and
# stop noticing warnings entirely". With the policy in the ini, a dependency bump
# that introduces a DeprecationWarning still fails the suite, but the exemption
# can be scoped to one message.
#
# Order matters: `error` first, then the narrowest possible ignores, because the
# last matching filter in this list wins. Always pin the message (and category
# where it is not the default) so an unrelated warning from the same library
# still fails.
filterwarnings =
    error
    # pytest-asyncio 1.4 still calls the event-loop policy API, deprecated in
    # Python 3.12+. Our code does not touch it; nothing to fix here until
    # pytest-asyncio stops using it. Silent under CI's Python 3.11.
    ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning
    ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning
    # starlette 1.x asks for httpx2 when only httpx is importable. It is a
    # UserWarning subclass (StarletteDeprecationWarning), not a
    # DeprecationWarning. requirements-dev.txt pins httpx2, so CI never sees it;
    # it fires in dev virtualenvs built from requirements.txt alone.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    ignore:.*:starlette.exceptions.StarletteDeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning

