name: CI - Complete Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  ENVIRONMENT: "test"
  HEADLESS: "true"
  # Deterministic, non-production credentials used only by CI processes.
  MASTER_ADMIN_PASSWORD: '$2b$12$a3tOM8qQ30A0ecM/cF4HvObV/UTRknpu6VqcfDzEEhHGfKeBiaFEu'
  JWT_SECRET: "ci-only-jwt-secret-not-for-production-32-chars"
  DRIVER_ENCRYPTION_KEY: "CQVgdhGECQA3DfLOcuHbmFI-IzFspWiCkVfiz3NkUS4="

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Runtime libs mypy needs to see real types instead of Any.
          pip install -r requirements-typecheck.txt
          cd apps/web && npm ci

      - name: Run Backend Linting
        run: ruff check app/ tests/

      - name: Check Backend Formatting
        run: black --check app/ tests/

      - name: Run Frontend Linting
        working-directory: apps/web
        run: npm run lint

      - name: Audit Frontend Dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - name: Run Backend Type Checking
        run: mypy app/ --ignore-missing-imports

      - name: Run Frontend Type Checking
        working-directory: apps/web
        run: npx tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Run independently so a quality failure cannot hide the test signal.
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: utcms_rpa_test
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Unit Tests
        run: |
          # Warning policy lives in pytest.ini (filterwarnings = error + scoped
          # ignores). A -W flag here would silently outrank it.
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/utcms_rpa_test
          REDIS_URL: redis://localhost:6379/0

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [quality-checks, test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Build Next.js App
        working-directory: apps/web
        run: |
          NEXT_PUBLIC_API_URL="/api" npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: barpro-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: barpro-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
