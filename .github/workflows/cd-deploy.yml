name: CD - Build & Deploy

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for GITHUB_TOKEN to publish backend/frontend images to GHCR.
permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "barpro"

jobs:
  # Deploy targets are optional. Without this gate, `deploy-staging` ran on every
  # push to main and — when STAGING_HOST is not configured — appleboy/ssh-action
  # failed with an empty host, so every push to main produced a red deploy job.
  # `secrets` cannot be read from a job-level `if:`, hence this tiny probe job.
  preflight:
    name: Check Configured Deploy Targets
    runs-on: ubuntu-latest
    outputs:
      has_staging: ${{ steps.check.outputs.has_staging }}
      has_production: ${{ steps.check.outputs.has_production }}
    steps:
      - id: check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          if [ -n "$STAGING_HOST" ]; then
            echo "has_staging=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_staging=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_HOST is not set — skipping staging deploy."
          fi
          if [ -n "$PRODUCTION_HOST" ]; then
            echo "has_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_production=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PRODUCTION_HOST is not set — skipping production deploy."
          fi

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-backend
          # `latest` is guarded by is_default_branch: without it a
          # workflow_dispatch from any branch overwrote `latest`, which is the
          # exact tag the deploy jobs pull. The raw github.sha tag gives the
          # deploy step an immutable reference to the image built in this run.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix={{branch}}-,priority=100
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build and Push Backend Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Build Next.js App
        working-directory: apps/web
        run: |
          NEXT_PUBLIC_API_URL="/api" npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-frontend
          # `latest` is guarded by is_default_branch: without it a
          # workflow_dispatch from any branch overwrote `latest`, which is the
          # exact tag the deploy jobs pull. The raw github.sha tag gives the
          # deploy step an immutable reference to the image built in this run.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix={{branch}}-,priority=100
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build and Push Frontend Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, preflight]
    if: |
      needs.preflight.outputs.has_staging == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    
    environment:
      name: staging
      url: https://staging.barpro.com
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            cd /opt/barpro
            # The server is a deployment target, not a workspace. An earlier
            # revision of this script ran `git add . && git commit` here as a
            # "pre-deploy backup", which leaves local commits on the server; once
            # that happened `git pull --ff-only` aborted and, under `set -e`, the
            # deploy stopped before deploying anything. Reset to the remote state
            # instead. reset --hard never touches untracked/ignored files, so
            # /opt/barpro/.env survives.
            git fetch origin --tags --prune
            if ! git diff --quiet HEAD 2>/dev/null; then
              echo "NOTE: discarding local modifications to tracked files:"
              git status --porcelain
            fi
            git checkout -f -B main origin/main
            bash scripts/render_squid_configs.sh
            # Pin to the images built in this run rather than to `latest`.
            export BACKEND_IMAGE="ghcr.io/amir-hdri/barpro-main/barpro-backend:${{ github.sha }}"
            export FRONTEND_IMAGE="ghcr.io/amir-hdri/barpro-main/barpro-frontend:${{ github.sha }}"
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            docker compose pull

            # Bring up data services first, then migrate, then switch the app.
            # Previously this ran `up -d` and only afterwards `exec backend alembic
            # upgrade head`, so new code served traffic against the old schema for
            # several seconds. `run --rm --no-deps` applies migrations using the
            # freshly pulled image without disturbing the running stack.
            docker compose up -d postgres redis
            for _ in $(seq 1 45); do
              if docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            docker compose run --rm --no-deps backend alembic upgrade head

            # Recreate only the services whose image or config changed. The old
            # `docker compose down` took the entire platform offline — including
            # Postgres and Redis — on every deploy, and killed in-flight RPA jobs.
            docker compose up -d --remove-orphans

            sleep 10
            docker compose ps
            # Probe through nginx (published on :80), NOT the backend port.
            # compose/backend.yml uses `expose: ['8000']`, so port 8000 is
            # reachable only inside the docker network — curling localhost:8000
            # from the host is always "connection refused" and, under `set -e`,
            # failed this job on every run.
            curl -f http://localhost/healthz
            docker logout ghcr.io || true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, preflight]
    if: |
      needs.preflight.outputs.has_production == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    
    environment:
      name: production
      url: https://barpro.com
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wait for Manual Approval
        if: github.event_name != 'workflow_dispatch'
        run: echo "Waiting for manual approval..."
        
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -e
            cd /opt/barpro
            # The server is a deployment target, not a workspace. An earlier
            # revision of this script ran `git add . && git commit` here as a
            # "pre-deploy backup", which leaves local commits on the server; once
            # that happened `git pull --ff-only` aborted and, under `set -e`, the
            # deploy stopped before deploying anything. Reset to the remote state
            # instead. reset --hard never touches untracked/ignored files, so
            # /opt/barpro/.env survives.
            git fetch origin --tags --prune
            if ! git diff --quiet HEAD 2>/dev/null; then
              echo "NOTE: discarding local modifications to tracked files:"
              git status --porcelain
            fi
            git checkout -f --detach "${{ github.sha }}"
            bash scripts/render_squid_configs.sh
            # Pin to the images built in this run rather than to `latest`.
            export BACKEND_IMAGE="ghcr.io/amir-hdri/barpro-main/barpro-backend:${{ github.sha }}"
            export FRONTEND_IMAGE="ghcr.io/amir-hdri/barpro-main/barpro-frontend:${{ github.sha }}"
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            docker compose pull

            # Bring up data services first, then migrate, then switch the app.
            # Previously this ran `up -d` and only afterwards `exec backend alembic
            # upgrade head`, so new code served traffic against the old schema for
            # several seconds. `run --rm --no-deps` applies migrations using the
            # freshly pulled image without disturbing the running stack.
            docker compose up -d postgres redis
            for _ in $(seq 1 45); do
              if docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            docker compose run --rm --no-deps backend alembic upgrade head

            # Recreate only the services whose image or config changed. The old
            # `docker compose down` took the entire platform offline — including
            # Postgres and Redis — on every deploy, and killed in-flight RPA jobs.
            docker compose up -d --remove-orphans

            # FLUSHALL intentionally disabled: it would destroy active sessions
            # and task state during deployment.
            sleep 15
            docker compose ps
            # Probe the deployment locally through nginx. The previous target
            # (https://barpro.com/healthz) is a placeholder that appears nowhere
            # in the real configuration: nginx serves `server_name _` on port 80
            # and the 443 block is still commented out (ISSUES.md S11). Under
            # `set -e` that curl failed the production deploy on every run.
            # Re-add an external probe here once HTTPS and the real domain are in
            # place.
            curl -f http://localhost/healthz
            docker logout ghcr.io || true
            echo "Production deployment completed successfully"

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Send Deployment Notification
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Deployment notification would be sent here"
          # Integration with Slack/Discord/Email would go here
          # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment of ${{ github.ref }} completed"}' ${{ secrets.SLACK_WEBHOOK }}
