name: CD - Build & Deploy

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "barpro"

jobs:
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix={{branch}}-,priority=100
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Build Next.js App
        working-directory: apps/web
        run: |
          NEXT_PUBLIC_API_URL="/api" npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix={{branch}}-,priority=100
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Frontend Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    
    environment:
      name: staging
      url: https://staging.barpro.com
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            # Pull latest images
            docker-compose -f /opt/barpro/docker-compose.yml pull
            
            # Stop services
            docker-compose -f /opt/barpro/docker-compose.yml down
            
            # Start with new images
            docker-compose -f /opt/barpro/docker-compose.yml up -d
            
            # Run database migrations
            docker-compose -f /opt/barpro/docker-compose.yml exec backend alembic upgrade head
            
            # Health check
            sleep 10
            docker-compose -f /opt/barpro/docker-compose.yml ps
            curl -f http://localhost:8000/healthz || true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    
    environment:
      name: production
      url: https://barpro.com
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wait for Manual Approval
        if: github.event_name != 'workflow_dispatch'
        run: echo "Waiting for manual approval..."
        
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            # Backup current deployment
            cd /opt/barpro
            git add .
            git commit -m "Pre-deploy backup $(date)" || true
            
            # Pull latest images
            docker-compose -f docker-compose.yml pull
            
            # Stop services gracefully
            docker-compose -f docker-compose.yml down
            
            # Start with new images
            docker-compose -f docker-compose.yml up -d
            
            # Run database migrations
            docker-compose -f docker-compose.yml exec backend alembic upgrade head
            
            # Clear caches
            # docker-compose -f docker-compose.yml exec redis redis-cli FLUSHALL || true
            # FLUSHALL disabled: clearing all Redis data during deployment destroys active sessions and task state.
            
            # Health check
            sleep 15
            docker-compose -f docker-compose.yml ps
            curl -f https://barpro.com/healthz || true
            
            # Notify success
            echo "Production deployment completed successfully"

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Send Deployment Notification
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Deployment notification would be sent here"
          # Integration with Slack/Discord/Email would go here
          # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment of ${{ github.ref }} completed"}' ${{ secrets.SLACK_WEBHOOK }}
