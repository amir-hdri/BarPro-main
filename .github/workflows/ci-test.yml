name: CI - Test & Validate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: "sqlite+aiosqlite:///./test.db"
  ENVIRONMENT: "test"
  JWT_SECRET: "test-secret-change-in-production"
  DRIVER_ENCRYPTION_KEY: "test-encryption-key-change-in-production"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: utcms_rpa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Backend Linting
        run: |
          ruff check app/ tests/
          black --check app/ tests/
          mypy app/ --ignore-missing-imports

      - name: Run Backend Unit Tests
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml
          coverage xml -o coverage.xml
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/utcms_rpa_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          DRIVER_ENCRYPTION_KEY: ${{ env.DRIVER_ENCRYPTION_KEY }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Run Frontend Linting
        working-directory: apps/web
        run: |
          npm run lint

      - name: Run Frontend Type Checking
        working-directory: apps/web
        run: |
          npx tsc --noEmit

      - name: Build Frontend
        working-directory: apps/web
        run: |
          npm run build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: utcms_rpa_test
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Integration Tests
        run: |
          pytest tests/test_integration/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/utcms_rpa_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          DRIVER_ENCRYPTION_KEY: ${{ env.DRIVER_ENCRYPTION_KEY }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Security Tools
        run: |
          pip install bandit safety pip-audit

      - name: Run Bandit Security Linter
        run: |
          bandit -r app/ -ll -ii

      - name: Run Safety Check
        run: |
          safety check --full-report
          continue-on-error: true

      - name: Audit Dependencies
        run: |
          pip-audit --desc --strict
          continue-on-error: true
