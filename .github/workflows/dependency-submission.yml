name: Dependency Snapshot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Generate Dependency Snapshot
        run: |
          pip list --format json > dependencies.json
          cat dependencies.json

      - name: Upload Dependency Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: dependencies.json
          retention-days: 30

      - name: Security Audit
        run: |
          pip-audit --desc
        continue-on-error: true

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          pip install cyclonedx-python
          cyclonedx-py -o cyclonedx-bom.xml
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: cyclonedx-bom.xml
          retention-days: 30
        continue-on-error: true
