[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "celery.*",
    "redis.*",
    "sqlmodel.*",
    "alembic.*",
]
ignore_missing_imports = true

# ⚠️ WARNING — the backend is currently NOT type-checked.
# This override suppresses every error in app/*, so the CI step
# `mypy app/ --ignore-missing-imports` always passes regardless of the strict
# settings above. A green "Backend Type Checking" job means nothing today.
#
# To re-enable incrementally (do this once, then keep the list shrinking):
#   1. mypy app/ --ignore-missing-imports > /tmp/mypy.txt   # measure the surface
#   2. delete this override
#   3. re-add it per-package for the modules that still fail, e.g.
#        [[tool.mypy.overrides]]
#        module = ["app.automation.*", "app.workers.*"]
#        ignore_errors = true
#      so newly written modules are checked from day one.
[[tool.mypy.overrides]]
module = "app.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

# Ruff owns linting/import sorting; Black is the repository's sole formatter.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# NOTE: pytest configuration lives in pytest.ini, which takes precedence over
# [tool.pytest.ini_options] here. Keeping both meant this block was silently
# ignored (including asyncio_mode and the --cov flags), so it was removed.
# Edit pytest.ini instead. Coverage settings below are read by coverage.py
# directly and remain in effect.

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
