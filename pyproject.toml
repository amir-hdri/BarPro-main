[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "celery.*",
    "redis.*",
    "sqlmodel.*",
    "alembic.*",
]
ignore_missing_imports = true

# Type-checking debt, per package.
#
# This list replaces a blanket `module = "app.*"` override that suppressed every
# error under app/, which made the CI step `mypy app/ --ignore-missing-imports`
# pass unconditionally — a green "Backend Type Checking" job proved nothing.
#
# Everything NOT listed here is type-checked for real as of this change:
# app/main.py, app/auth_multitenant.py, app/models_*.py, app.bot, app.models,
# app.monitoring, app.realtime, app.rpa, app.schemas, app.queue, app.config.
# They pass with zero errors, so new code in them is checked from day one.
#
# Error counts measured with mypy 2.3.0, python_version 3.11, and
# requirements-typecheck.txt installed (see that file — without those libraries
# the numbers are both smaller and wrong):
#
#     app.services      201 errors in 21 files
#     app.automation    137 errors in 25 files
#     app.core           56 errors in 12 files
#     app.orchestrator   32 errors in  7 files
#     app.workers        19 errors in  3 files
#     app.api            17 errors in  3 files
#     ------------------------------------------
#     total             462 errors in 71 files
#
# The list is meant to shrink. To pay a package down:
#   1. mypy app/ --ignore-missing-imports --config-file <copy without that entry>
#   2. fix the errors, delete the entry, update the table above.
# Prefer removing a whole package at a time; a package with an entry here is
# invisible to the gate, so a partially-fixed package buys nothing until the
# entry goes away.
[[tool.mypy.overrides]]
module = [
    "app.services.*",
    "app.automation.*",
    "app.core.*",
    "app.orchestrator.*",
    "app.workers.*",
    "app.api.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

# Ruff owns linting/import sorting; Black is the repository's sole formatter.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# NOTE: pytest configuration lives in pytest.ini, which takes precedence over
# [tool.pytest.ini_options] here. Keeping both meant this block was silently
# ignored (including asyncio_mode and the --cov flags), so it was removed.
# Edit pytest.ini instead. Coverage settings below are read by coverage.py
# directly and remain in effect.

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
