[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Central handling for optional/untyped third-party dependencies.
# jdatetime ships no py.typed marker; a minimal stub (jdatetime.pyi) covers
# the API surface used. torch/keras/tensorflow are heavy ML wheels
# intentionally excluded from the typecheck venv (their imports are guarded
# at runtime).
[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "celery.*",
    "redis.*",
    "sqlmodel.*",
    "alembic.*",
    "torch.*",
    "keras.*",
    "tensorflow.*",
]
ignore_missing_imports = true

# Type-checking debt: fully paid down as of 2026-10-01.
#
# The per-package `ignore_errors` overrides were removed after the mypy
# pay-down verified `mypy app/` green with zero broad suppressions
# (206 source files, strict flags above; only the central
# ignore_missing_imports for optional/untyped third-party deps remains).
# `scripts/` is also clean. Do not reintroduce blanket ignores.

# Ruff owns linting/import sorting; Black is the repository's sole formatter.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# NOTE: pytest configuration lives in pytest.ini, which takes precedence over
# [tool.pytest.ini_options] here. Keeping both meant this block was silently
# ignored (including asyncio_mode and the --cov flags), so it was removed.
# Edit pytest.ini instead. Coverage settings below are read by coverage.py
# directly and remain in effect.

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
