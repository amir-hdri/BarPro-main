# ═══════════════════════════════════════════════════════════════
#  لایه ۴: وب (Web / Frontend)
#  شامل: Next.js Frontend, Nginx (reverse proxy)
#
#  nginx به عنوان تنها درگاه ورودی به سیستم عمل می‌کند:
#    پورت 80 → nginx → (backend:8000 | frontend:3000)
#
#  دیباگ مستقل:
#    docker compose -f compose/web.yml logs -f nginx
#    docker compose -f compose/web.yml logs -f frontend
#    docker compose -f compose/web.yml restart nginx
#
#  تست پیکربندی nginx:
#    docker compose -f compose/web.yml exec nginx nginx -t
# ═══════════════════════════════════════════════════════════════

networks:
  platform:
    external: true
    name: barpro_platform

services:

  # ── فرانت‌اند Next.js ─────────────────────────────────────────
  frontend:
    image: barpro-frontend:latest
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: barpro-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose: ['3000']
    networks: [platform]
    mem_limit: 512m
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx — تنها درگاه ورودی به سیستم ──────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: barpro-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/http-server.conf:/etc/nginx/http-server.conf:ro
    # بعد از نصب گواهی HTTPS: خط زیر را uncomment کنید
    # - ../infra/nginx/ssl:/etc/nginx/ssl:ro
    # ✅ تنها پورتی که به اینترنت باز است
    ports:
      - '80:80'
    # بعد از نصب گواهی HTTPS: خط زیر را uncomment کنید
    # - '443:443'
    networks: [platform]
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO/dev/null http://localhost/healthz 2>&1 | grep -q "200\\|301\\|302" || curl -sf http://localhost/healthz || exit 0']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
