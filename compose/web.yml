# ═══════════════════════════════════════════════════════════════
#  لایه ۴: وب (Web / Frontend)
#  شامل: Next.js Frontend, Nginx (reverse proxy)
#
#  nginx به عنوان تنها درگاه ورودی به سیستم عمل می‌کند:
#    پورت 80 → nginx → (backend:8000 | frontend:3000)
#
#  دیباگ مستقل:
#    docker compose -f compose/web.yml logs -f nginx
#    docker compose -f compose/web.yml logs -f frontend
#    docker compose -f compose/web.yml restart nginx
#
#  تست پیکربندی nginx:
#    docker compose -f compose/web.yml exec nginx nginx -t
# ═══════════════════════════════════════════════════════════════

networks:
  platform:
    external: true
    name: barpro_platform

services:

  # ── فرانت‌اند Next.js ─────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-barpro-frontend:latest}
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      network: host
    container_name: barpro-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    expose: ['3000']
    networks: [platform]
    mem_limit: 1g        # ↑ از 512m — برای روان‌بودن SSR و کش Next.js روی 16GB
    mem_reservation: 512m  # ↑ از 256m
    healthcheck:
      test: ['CMD-SHELL', 'grep -q ":0BB8" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx — تنها درگاه ورودی به سیستم ──────────────────────
  nginx:
    image: nginx:1.27.0-alpine
    container_name: barpro-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/http-server.conf:/etc/nginx/http-server.conf:ro
    # بعد از نصب گواهی HTTPS: خط زیر را uncomment کنید
    # - ../infra/nginx/ssl:/etc/nginx/ssl:ro
    # ✅ تنها پورتی که به اینترنت باز است
    ports:
      - '80:80'
    # بعد از نصب گواهی HTTPS: خط زیر را uncomment کنید
    # - '443:443'
    networks: [platform]
    mem_limit: 512m      # ↑ از 256m — buffer zone برای spikes ترافیک
    mem_reservation: 256m  # ↑ از 128m
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "nginx: master" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
