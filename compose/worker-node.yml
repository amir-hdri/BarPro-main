# BarPro — Worker Node Docker Compose Template
# =============================================
# Usage: Copy this file to a new Worker server and run:
#
#   cp compose/worker-node.yml /opt/barpro/compose/worker-node.yml
#   # Edit the .env file on the worker server (see docs/adding_new_worker.md)
#   docker compose -f compose/worker-node.yml up -d
#
# Required environment variables on the Worker server:
#   WORKER_ID          — numeric registry identity, derived from WORKER_IP_INDEX (2 or 3)
#                        so it is identical in format to backend.yml ("2", "3" — not "worker_2")
#   WORKER_IP_INDEX    — numeric IP index: 2 or 3 (must be in AVAILABLE_IP_INDICES
#                        on the Central server; used for queue suffixes + circuit breaker)
#   WORKER_PROXY_PORT  — Squid listen port on this server, e.g. "3128"
#   DATABASE_URL       — postgresql+asyncpg://barpro_worker:<pw>@<CENTRAL_IP>:5432/utcms_rpa
#   REDIS_URL          — redis://:<pw>@<CENTRAL_IP>:6379/0
#   CELERY_BROKER_URL  — MUST use DB 0 (same as Central): redis://:<pw>@<CENTRAL_IP>:6379/0
#   CELERY_RESULT_BACKEND — same DB 0 (defaults to REDIS_URL if unset)
#   CAPTCHA_PROVIDER   — auto
#   HEADLESS           — true
#
# IMPORTANT: CELERY_BROKER_URL must point to Redis DB 0 — the Central API publishes
# tasks to DB 0. Using DB 1/2 silently breaks task delivery to remote workers.

version: "3.9"

networks:
  worker_local:
    driver: bridge

services:
  # ─────────────────────────────────────────────
  # Squid Proxy — local egress via THIS server's IP
  # ─────────────────────────────────────────────
  squid:
    image: ubuntu/squid:latest
    container_name: barpro-squid-worker
    restart: unless-stopped
    # network_mode: host is required so Squid uses the Worker server's real IP
    # when connecting to UTCMS — this is the "one IP per Worker" design.
    network_mode: host
    volumes:
      # Render infra/squid/squid_worker.conf -> infra/squid/squid_worker.runtime.conf
      # (substituting __WORKER_EGRESS_IP__ / __CENTRAL_IP__) on each worker node —
      # see setup_worker.sh / deploy_all_servers.sh. Mounting the rendered copy
      # keeps the git template intact and always exists after a git pull.
      - ../infra/squid/squid_worker.runtime.conf:/etc/squid/squid.conf:ro
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    mem_reservation: 64m

  # ─────────────────────────────────────────────
  # Celery Worker — RPA executor
  # ─────────────────────────────────────────────
  worker:
    # Published by .github/workflows/cd-deploy.yml (tag "latest" on main).
    # Verify on the worker: docker pull ghcr.io/amir-hdri/barpro-main/barpro-backend:latest
    image: ${BACKEND_IMAGE:-ghcr.io/amir-hdri/barpro-main/barpro-backend:latest}
    container_name: barpro-celery-worker
    restart: unless-stopped
    depends_on:
      - squid
    networks:
      - worker_local
    env_file:
      - ../.env
    # rpa_scheduler is a singleton control queue consumed by the dedicated
    # profile-less celery_scheduler service on the CENTRAL server (compose/
    # backend.yml). Remote worker nodes must NOT consume it — if they did, the
    # dispatcher (every 5s) could sit behind a 360s browser task and starve.
    command:
      - /bin/sh
      - -ec
      - |
        : "$${WORKER_IP_INDEX:?WORKER_IP_INDEX is required}"
        queues="waybill_tasks,waybill_tasks_$${WORKER_IP_INDEX},rpa_auth_$${WORKER_IP_INDEX},rpa_submit_$${WORKER_IP_INDEX},reconciliation_tasks,reconciliation_tasks_$${WORKER_IP_INDEX}"
        queues="$${queues},scheduled_tasks,scheduled_tasks_$${WORKER_IP_INDEX},barpro.fuel.inquiry"
        exec celery -A app.workers.celery_app worker \
          --loglevel=info \
          --concurrency=1 \
          --prefetch-multiplier=1 \
          --pool=solo \
          -Q "$${queues}" \
          --max-tasks-per-child=50
    environment:
      # Identity — WORKER_ID is derived from WORKER_IP_INDEX so it is always a
      # numeric value ("2", "3") identical in format to backend.yml, keeping
      # worker_registry keys and monitoring/dashboard labels consistent.
      WORKER_ID: ${WORKER_IP_INDEX:?WORKER_IP_INDEX is required (2 or 3, must match AVAILABLE_IP_INDICES on Central)}
      WORKER_IP_INDEX: ${WORKER_IP_INDEX:?WORKER_IP_INDEX is required (2 or 3, must match AVAILABLE_IP_INDICES on Central)}
      # Database (points to Central server — must be reachable via Worker IP allowlist)
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      # Proxy — routes Playwright traffic through local Squid
      # get_worker_proxy_url() reads WORKER_{WORKER_ID}_PROXY or RPA_PROXIES.
      # "squid" resolves to the host via host-gateway (Docker 20.10+), so the
      # container reaches the host-network Squid through the bridge gateway.
      # WORKER_2_PROXY / WORKER_3_PROXY are forced here (FIX-C) so that a
      # stale WORKER_2_PROXY leaked from a central .env (via env_file) can never
      # hijack a remote worker onto the wrong Squid. Only the key matching the
      # worker's WORKER_ID is read at runtime, so setting both is harmless.
      RPA_PROXIES: http://squid:${WORKER_PROXY_PORT:-3128}
      WORKER_2_PROXY: http://squid:${WORKER_PROXY_PORT:-3128}
      WORKER_3_PROXY: http://squid:${WORKER_PROXY_PORT:-3128}
      # CAPTCHA & Browser
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-auto}
      HEADLESS: ${HEADLESS:-true}
      # Queue feature flags
      QUEUE_ENABLED: "true"
      QUEUE_INLINE_FALLBACK: "false"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\" && grep -q celery /proc/1/comm || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      # Shared memory for Chromium
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 536870912  # 512 MB
    shm_size: "512m"
    cap_add:
      - SYS_ADMIN   # required for Chromium sandbox
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    mem_reservation: 2g
    extra_hosts:
      # Makes "central" resolve to the Central server IP
      - "central:${CENTRAL_IP:-127.0.0.1}"
      # Makes "squid" resolve to the host gateway (host-network Squid)
      - "squid:host-gateway"
