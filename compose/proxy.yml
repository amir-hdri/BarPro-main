# ═══════════════════════════════════════════════════════════════
#  لایه ۲: پروکسی خروجی (Proxy)
#
#  Model B (production/default): فقط Squid 1 روی Central اجرا می‌شود.
#  Model A (single VM): Squid 2/3 فقط با profile صریح model-a اجرا می‌شوند.
#
#  هر ورکر از IP متفاوتی برای ارسال درخواست استفاده می‌کند:
#    squid_1 → IP اول (<CENTRAL_IP>) — ورکر ۱
#    squid_2 → IP دوم (<SECONDARY_EGRESS_IP>) — ورکر ۲ (Model A only)
#    squid_3 → IP سوم                         — ورکر ۳ (Model A only)
#
#  دیباگ مستقل (ابتدا رندر کانفیگ‌ها — قالب‌های گیت را هرگز sed -i نکنید):
#    bash scripts/render_squid_configs.sh --dev   # یا با IPهای واقعی
#    docker compose -f compose/proxy.yml up                    # Model B: squid_1
#    docker compose -f compose/proxy.yml --profile model-a up  # Model A: squid_1/2/3
#    docker compose -f compose/proxy.yml logs -f squid_1
#    docker compose -f compose/proxy.yml exec squid_1 squidclient -h localhost mgr:info
# ═══════════════════════════════════════════════════════════════

services:

  # ── پروکسی خروجی IP اول ──────────────────────────────────────
  squid_1:
    image: ubuntu/squid:latest
    container_name: barpro-squid-1
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../infra/squid/squid_1.runtime.conf:/etc/squid/squid.conf:ro
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ['CMD-SHELL', '/bin/bash -c "exec 3<>/dev/tcp/127.0.0.1/3128" 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── پروکسی خروجی IP دوم ──────────────────────────────────────
  squid_2:
    image: ubuntu/squid:latest
    container_name: barpro-squid-2
    restart: unless-stopped
    profiles: ["model-a"]
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../infra/squid/squid_2.runtime.conf:/etc/squid/squid.conf:ro
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ['CMD-SHELL', '/bin/bash -c "exec 3<>/dev/tcp/127.0.0.1/3129" 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── پروکسی خروجی IP سوم ──────────────────────────────────────
  squid_3:
    image: ubuntu/squid:latest
    container_name: barpro-squid-3
    restart: unless-stopped
    profiles: ["model-a"]
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../infra/squid/squid_3.runtime.conf:/etc/squid/squid.conf:ro
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ['CMD-SHELL', '/bin/bash -c "exec 3<>/dev/tcp/127.0.0.1/3130" 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
