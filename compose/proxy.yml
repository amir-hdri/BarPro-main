# ═══════════════════════════════════════════════════════════════
#  لایه ۲: پروکسی خروجی (Proxy)
#  شامل: Squid Proxy 1, 2, 3
#
#  هر ورکر از IP متفاوتی برای ارسال درخواست استفاده می‌کند:
#    squid_1 → IP اول (188.121.123.16) — ورکر ۱
#    squid_2 → IP دوم (95.38.233.90)  — ورکر ۲ (از سرور ۲)
#    squid_3 → IP سوم               — ورکر ۳
#
#  دیباگ مستقل:
#    docker compose -f compose/proxy.yml up
#    docker compose -f compose/proxy.yml logs -f squid_1
#    docker compose -f compose/proxy.yml exec squid_1 squidclient -h localhost mgr:info
# ═══════════════════════════════════════════════════════════════

services:

  # ── پروکسی خروجی IP اول ──────────────────────────────────────
  squid_1:
    image: ubuntu/squid:6.6-ubuntu22.04
    container_name: barpro-squid-1
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../infra/squid/squid_1.conf:/etc/squid/squid.conf:ro
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/3128 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── پروکسی خروجی IP دوم ──────────────────────────────────────
  squid_2:
    image: ubuntu/squid:6.6-ubuntu22.04
    container_name: barpro-squid-2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../infra/squid/squid_2.conf:/etc/squid/squid.conf:ro
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/3129 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── پروکسی خروجی IP سوم ──────────────────────────────────────
  squid_3:
    image: ubuntu/squid:6.6-ubuntu22.04
    container_name: barpro-squid-3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../infra/squid/squid_3.conf:/etc/squid/squid.conf:ro
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/3130 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
