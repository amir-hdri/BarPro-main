# ═══════════════════════════════════════════════════════════════
#  لایه ۱: زیرساخت داده (Infrastructure)
#  شامل: PostgreSQL, Redis
#
#  دیباگ مستقل:
#    docker compose -f compose/infra.yml up
#    docker compose -f compose/infra.yml logs -f postgres
#    docker compose -f compose/infra.yml exec postgres psql -U postgres
# ═══════════════════════════════════════════════════════════════

networks:
  platform:
    external: true
    name: barpro_platform

volumes:
  postgres_data:
    name: barpro_postgres_data
  redis_data:
    name: barpro_redis_data

services:

  # ── پایگاه داده اصلی ─────────────────────────────────────────
  postgres:
    image: postgres:16.4
    container_name: barpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-utcms_rpa}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=150"]
    # ✅ امنیت: به‌طور پیش‌فرض فقط روی localhost بایند است (تست‌ها و ابزارهای محلی)
    # در Model B (ورکرهای راه‌دور) از .env روی 0.0.0.0 تنظیم می‌شود؛
    # دسترسی از بیرون فقط با UFW allowlist (setup_firewall_central.sh) مجاز است.
    ports: ['${POSTGRES_BIND:-127.0.0.1}:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-utcms_rpa}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [platform]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g        # ↑ از 1.5g — متناسب با پروفایل سرور مرکزی 32GB
    mem_reservation: 2g  # ↑ از 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── صف پیام و کش ─────────────────────────────────────────────
  redis:
    image: redis:7.2.5-alpine
    container_name: barpro-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 800mb   # ↑ از 400mb — متناسب با mem_limit 1g در سرور مرکزی 32GB
      - --maxmemory-policy allkeys-lru
      - --save 60 1
    volumes:
      - redis_data:/data
    # ✅ امنیت: به‌طور پیش‌فرض فقط روی localhost بایند است؛ در Model B از .env روی 0.0.0.0
    # (UFW فقط به IP ورکرها اجازه می‌دهد)
    ports: ['${REDIS_BIND:-127.0.0.1}:6379:6379']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [platform]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g        # ↑ از 512m — متناسب با پروفایل سرور مرکزی 32GB
    mem_reservation: 512m  # ↑ از 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
