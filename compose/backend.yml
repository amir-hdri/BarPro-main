# ═══════════════════════════════════════════════════════════════
#  لایه ۳: بک‌اند (Backend)
#  شامل: FastAPI Backend, Celery Workers x3, Celery Beat
#
#  هر ورکر از صف Celery متفاوتی استفاده می‌کند:
#    backend        → API اصلی (FastAPI)
#    celery_worker_1 → صف‌های IP اول (waybill_tasks_1, rpa_auth_1, ...)
#    celery_worker_2 → صف‌های IP دوم (waybill_tasks_2, rpa_auth_2, ...)
#    celery_worker_3 → صف‌های IP سوم (waybill_tasks_3, rpa_auth_3, ...)
#    celery_scheduler→ مصرف‌کننده‌ی اختصاصی صف کنترلی rpa_scheduler (بدون profile)
#    celery_beat     → زمان‌بند وظایف دوره‌ای
#
#  دیباگ مستقل (نیاز به infra.yml و proxy.yml):
#    docker compose -f compose/infra.yml -f compose/proxy.yml -f compose/backend.yml up
#    docker compose -f compose/backend.yml logs -f backend
#    docker compose -f compose/backend.yml logs -f celery_worker_1
#    docker compose -f compose/backend.yml exec backend python -c "from app.main import app; print('OK')"
#
#  ری‌استارت فقط بک‌اند:
#    docker compose -f compose/backend.yml restart backend
# ═══════════════════════════════════════════════════════════════

networks:
  platform:
    external: true
    name: barpro_platform

volumes:
  runtime_data:
    name: barpro_runtime_data

# ── متغیرهای مشترک بین تمام سرویس‌های بک‌اند ─────────────────
x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:-barpro_backend:latest}
  build:
    context: ..
    dockerfile: Dockerfile
    network: host
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  env_file: [../.env]
  environment: &backend-env
    PYTHON_ENV: production
    SKIP_MIGRATIONS: "false"  # PostgreSQL advisory lock از اجرای موازی جلوگیری می‌کند
    # ✅ استفاده از نام سرویس (postgres) به عنوان hostname در شبکه داکر
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-utcms_rpa}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    # ✅ کلید رمزگذاری پسورد راننده — MUST come from .env, never hardcode
    DRIVER_ENCRYPTION_KEY: ${DRIVER_ENCRYPTION_KEY}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    # ✅ پشتیبانی از چند آی‌پی برای CORS در سرور دو کارت شبکه‌ای
    FRONTEND_URLS: ${FRONTEND_URLS:-}
    FRONTEND_URL_ALT: ${FRONTEND_URL_ALT:-}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    AUTH_STATE_PATH: /app/runtime/auth/utcms_state.json
    FUEL_SCREENSHOTS_DIR: /app/runtime/screenshots/fuel
    ENVIRONMENT: ${ENVIRONMENT:-production}
    LOGIN_URL: ${LOGIN_URL:-https://barname.utcms.ir/Account/Login}
    HEADLESS: ${HEADLESS:-true}
    ALLOW_LIVE_SUBMIT: ${ALLOW_LIVE_SUBMIT:-false}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    CAPTCHA_LOCAL_ONLY: "false"
    KERAS_PYTHON_PATH: ${KERAS_PYTHON_PATH:-python3}
    KERAS_MODEL_PATH: ${KERAS_MODEL_PATH:-persian_number_ocr.keras}
    # ✅ استفاده از کرومیوم مدیریت شده توسط Playwright در /opt/playwright-browsers/
    # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium  # غیرفعال شده - از کرومیوم Playwright استفاده می‌شود
  networks: [platform]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ../app:/app/app:ro
    - ../alembic:/app/alembic:ro
    - runtime_data:/app/runtime
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  # ── API اصلی ─────────────────────────────────────────────────
  backend:
    <<: *backend-common
    container_name: barpro-backend
    shm_size: '256m'
    mem_limit: 512m      # ↑ از 256m — پاسخ‌دهی سریع‌تر API روی 16GB
    mem_reservation: 256m  # ↑ از 128m
    environment:
      <<: *backend-env
      PORT: 8000
    # ✅ C2 fix: trust X-Forwarded-For ONLY from the internal Docker network so
    # request.client.host is the REAL client IP (nginx is the sole trusted peer).
    # Without --proxy-headers every request appears to come from the nginx
    # container IP and per-IP rate-limit buckets collapse into ONE global
    # bucket (5 logins/min for the whole system → systemic 429 lockout).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-keep-alive", "30", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1,172.16.0.0/12,10.0.0.0/8"]
    # ✅ امنیت: فقط از طریق nginx در دسترس است
    expose: ['8000']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/healthz || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── ورکر IP اول ──────────────────────────────────────────────
  celery_worker_1:
    <<: *backend-common
    image: ${BACKEND_IMAGE:-barpro_backend:latest}
    container_name: barpro-worker-1
    cap_add: [SYS_ADMIN]
    shm_size: '512m'
    mem_limit: 3g        # ↑ از 2.5g — فضای بیشتر برای Chromium + PyTorch روی 16GB
    mem_reservation: 2.5g  # ↑ از 2g
    stop_grace_period: 10m
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - waybill_tasks,waybill_tasks_1,rpa_auth_1,rpa_submit_1,reconciliation_tasks,reconciliation_tasks_1,scheduled_tasks,scheduled_tasks_1,barpro.fuel.inquiry
      - --concurrency=1
      - --prefetch-multiplier=1
      - --pool=solo
      - -n
      - worker_1@%h
    environment:
      <<: *backend-env
      WORKER_ID: "1"
      WORKER_IP_INDEX: 1
      # R1: `environment:` always overrides `env_file:`, so per-worker proxy
      # values MUST be interpolated from the deploy-time .env with a fallback —
      # never hardcoded. Deploy scripts (manage.sh / quick_deploy_central.sh,
      # deploy_all_servers.sh, deploy_remote.sh, deploy_single_vm.py) write
      # WORKER_N_PROXY into .env; a hardcoded value here silently neutralizes
      # them (e.g. two-node topology would proxy worker 2 through the central
      # server instead of http://<NODE2_IP>:3128).
      WORKER_1_PROXY: ${WORKER_1_PROXY:-http://172.20.0.1:3128}
      RPA_PROXIES: ${WORKER_1_PROXY:-http://172.20.0.1:3128}
             # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium  # غیرفعال شده
    # Real proxy healthcheck: surface a misconfigured/unreachable proxy as an
    # "unhealthy" container instead of silently failing every job (FIX-E/X2).
    healthcheck:
      test: ['CMD-SHELL', 'python -c "from app.automation.worker_proxy import get_worker_proxy_url as g; g() or exit(1)" || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3


  # ── ورکر IP دوم ──────────────────────────────────────────────
  celery_worker_2:
    <<: *backend-common
    image: ${BACKEND_IMAGE:-barpro_backend:latest}
    container_name: barpro-worker-2
    cap_add: [SYS_ADMIN]
    # Model B (scale-out): worker 2/3 run on REMOTE worker nodes.
    # On the central server they are optional — enable with:
    #   docker compose -f compose/backend.yml --profile scale-out up -d
    profiles: ["scale-out"]
    shm_size: '512m'
    mem_limit: 2.5g
    mem_reservation: 2g
    stop_grace_period: 10m
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - waybill_tasks,waybill_tasks_2,rpa_auth_2,rpa_submit_2,reconciliation_tasks,reconciliation_tasks_2,scheduled_tasks_2,barpro.fuel.inquiry
      - --concurrency=1
      - --prefetch-multiplier=1
      - --pool=solo
      - -n
      - worker_2@%h
    environment:
      <<: *backend-env
      WORKER_ID: "2"
      WORKER_IP_INDEX: 2
      WORKER_2_PROXY: ${WORKER_2_PROXY:-http://172.20.0.1:3129}
             # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium  # غیرفعال شده
    healthcheck:
      test: ['CMD-SHELL', 'python -c "from app.automation.worker_proxy import get_worker_proxy_url as g; g() or exit(1)" || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3


  # ــ ورکر IP سوم ──────────────────────────────────────────────
  celery_worker_3:
    <<: *backend-common
    image: ${BACKEND_IMAGE:-barpro_backend:latest}
    container_name: barpro-worker-3
    cap_add: [SYS_ADMIN]
    # Model B (scale-out): worker 2/3 run on REMOTE worker nodes.
    # On the central server they are optional — enable with:
    #   docker compose -f compose/backend.yml --profile scale-out up -d
    profiles: ["scale-out"]
    shm_size: '512m'
    mem_limit: 2.5g
    mem_reservation: 2g
    stop_grace_period: 10m
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - waybill_tasks,waybill_tasks_3,rpa_auth_3,rpa_submit_3,reconciliation_tasks,reconciliation_tasks_3,scheduled_tasks,scheduled_tasks_3,barpro.fuel.inquiry
      - --concurrency=1
      - --prefetch-multiplier=1
      - --pool=solo
      - -n
      - worker_3@%h
    environment:
      <<: *backend-env
      WORKER_ID: "3"
      WORKER_IP_INDEX: 3
      WORKER_3_PROXY: ${WORKER_3_PROXY:-http://172.20.0.1:3130}
      # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium  # غیرفعال شده
    healthcheck:
      test: ['CMD-SHELL', 'python -c "from app.automation.worker_proxy import get_worker_proxy_url as g; g() or exit(1)" || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3


  # ── زمان‌بند وظایف دوره‌ای ───────────────────────────────────
  celery_beat:
    <<: *backend-common
    image: ${BACKEND_IMAGE:-barpro_backend:latest}
    container_name: barpro-beat
    mem_limit: 256m      # ↑ از 128m — Beat واقعاً ~225MB RSS مصرف می‌کند (automation/captcha imports)
    mem_reservation: 128m  # ↑ از 64m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\" && grep -q celery /proc/1/comm || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - --loglevel=info
      - --schedule=/app/runtime/celerybeat-schedule


  # ── ورکر اختصاصی صف کنترلی rpa_scheduler ──────────────────────────────
  # The control queue (orchestrator dispatcher fires every 5s) MUST have an
  # always-on, profile-less, single-purpose consumer. Previously it lived on
  # worker 3 behind the "scale-out" profile (and on remote worker nodes), so a
  # central/dual-node deployment had NO consumer (NEW-1) or a starved one. This
  # dedicated service never shares its process with 360s waybill jobs.
  celery_scheduler:
    <<: *backend-common
    image: ${BACKEND_IMAGE:-barpro_backend:latest}
    container_name: barpro-scheduler
    hostname: barpro-scheduler   # non-numeric hostname -> resolve_ip_index() -> None
    shm_size: '128m'
    mem_limit: 768m
    mem_reservation: 384m
    stop_grace_period: 60s
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - rpa_scheduler
      - --concurrency=1
      - --prefetch-multiplier=1
      - --pool=solo
      - -n
      - scheduler@%h
    environment:
      <<: *backend-env
      # Non-numeric WORKER_ID -> ip_index = NULL -> the circuit breaker never
      # attributes an IP index to this control worker (zero routing impact).
      WORKER_ID: "scheduler"
      # Explicitly empty WORKER_IP_INDEX: `env_file: [../.env]` could leak a
      # numeric WORKER_IP_INDEX from the central .env into this container;
      # `environment:` overrides env_file, so an empty string guarantees this
      # control worker can never be attributed an egress index or drain
      # per-partition queues it does not consume.
      WORKER_IP_INDEX: ""
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import app; print(\"OK\")" || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
