# ═══════════════════════════════════════════════════════════════
#  لایه ۳: بک‌اند (Backend)
#  شامل: FastAPI Backend, Celery Workers x3, Celery Beat
#
#  هر ورکر از صف Celery متفاوتی استفاده می‌کند:
#    backend        → API اصلی (FastAPI)
#    celery_worker_1 → صف‌های IP اول (waybill_tasks_1, rpa_auth_1, ...)
#    celery_worker_2 → صف‌های IP دوم (waybill_tasks_2, rpa_auth_2, ...)
#    celery_worker_3 → صف‌های IP سوم (waybill_tasks_3, rpa_auth_3, ...)
#    celery_beat     → زمان‌بند وظایف دوره‌ای
#
#  دیباگ مستقل (نیاز به infra.yml و proxy.yml):
#    docker compose -f compose/infra.yml -f compose/proxy.yml -f compose/backend.yml up
#    docker compose -f compose/backend.yml logs -f backend
#    docker compose -f compose/backend.yml logs -f celery_worker_1
#    docker compose -f compose/backend.yml exec backend python -c "from app.main import app; print('OK')"
#
#  ری‌استارت فقط بک‌اند:
#    docker compose -f compose/backend.yml restart backend
# ═══════════════════════════════════════════════════════════════

networks:
  platform:
    external: true
    name: barpro_platform

volumes:
  runtime_data:
    name: barpro_runtime_data

# ── متغیرهای مشترک بین تمام سرویس‌های بک‌اند ─────────────────
x-backend-common: &backend-common
  image: barpro_backend:latest
  build:
    context: ..
    dockerfile: Dockerfile
    network: host
  restart: unless-stopped
  cap_add: [SYS_ADMIN, NET_ADMIN]
  security_opt: [no-new-privileges:true]
  env_file: [../.env]
  environment: &backend-env
    PYTHON_ENV: production
    SKIP_MIGRATIONS: "true"
    # ✅ استفاده از نام سرویس (postgres) به عنوان hostname در شبکه داکر
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-utcms_rpa}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    # ✅ کلید رمزگذاری پسورد راننده — MUST come from .env, never hardcode
    DRIVER_ENCRYPTION_KEY: ${DRIVER_ENCRYPTION_KEY}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    # ✅ پشتیبانی از چند آی‌پی برای CORS در سرور دو کارت شبکه‌ای
    FRONTEND_URLS: ${FRONTEND_URLS:-}
    FRONTEND_URL_ALT: ${FRONTEND_URL_ALT:-}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    AUTH_STATE_PATH: /app/runtime/auth/utcms_state.json
    FUEL_SCREENSHOTS_DIR: /app/runtime/screenshots/fuel
    ENVIRONMENT: ${ENVIRONMENT:-production}
    LOGIN_URL: ${LOGIN_URL:-https://barname.utcms.ir/Barname/Account/Login}
    HEADLESS: ${HEADLESS:-true}
    ALLOW_LIVE_SUBMIT: ${ALLOW_LIVE_SUBMIT:-false}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    MASTER_ADMIN_USERNAME: ${MASTER_ADMIN_USERNAME}
    MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD}
    KERAS_PYTHON_PATH: ${KERAS_PYTHON_PATH:-python3}
    KERAS_MODEL_PATH: ${KERAS_MODEL_PATH:-persian_number_ocr.keras}
    # ✅ استفاده از system chromium به جای Playwright's chromium (CDN blocked in Iran)
    PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
  networks: [platform]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ../app/services:/app/app/services:ro
    - ../app/workers:/app/app/workers:ro
    - ../app/core:/app/app/core:ro
    - ../app/automation:/app/app/automation:ro
    - ../app/api:/app/app/api:ro
    - ../app/bot:/app/app/bot:ro
    - ../alembic:/app/alembic:ro
    - runtime_data:/app/runtime
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  # ── API اصلی ─────────────────────────────────────────────────
  backend:
    <<: *backend-common
    container_name: barpro-backend
    shm_size: '256m'
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      <<: *backend-env
      PORT: 8000
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-keep-alive", "30"]
    # ✅ امنیت: فقط از طریق nginx در دسترس است
    expose: ['8000']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/healthz || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── ورکر IP اول ──────────────────────────────────────────────
  celery_worker_1:
    <<: *backend-common
    image: barpro_celery_worker_1:latest
    container_name: barpro-worker-1
    shm_size: '512m'
    mem_limit: 2.5g
    mem_reservation: 2g
    stop_grace_period: 10m
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - waybill_tasks_1,rpa_auth_1,rpa_submit_1,scheduled_tasks_1
      - --concurrency=1
      - -n
      - worker_1@%h
    environment:
      <<: *backend-env
      WORKER_ID: "1"
      WORKER_IP_INDEX: 1
      RPA_PROXIES: http://172.20.0.1:3128
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import sys; sys.exit(0)"']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3


  # ── ورکر IP دوم ──────────────────────────────────────────────
  celery_worker_2:
    <<: *backend-common
    image: barpro_celery_worker_2:latest
    container_name: barpro-worker-2
    shm_size: '512m'
    mem_limit: 2.5g
    mem_reservation: 2g
    stop_grace_period: 10m
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - waybill_tasks_2,rpa_auth_2,rpa_submit_2,scheduled_tasks_2
      - --concurrency=1
      - -n
      - worker_2@%h
    environment:
      <<: *backend-env
      WORKER_ID: "2"
      WORKER_IP_INDEX: 2
      RPA_PROXIES: http://172.20.0.1:3129
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import sys; sys.exit(0)"']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3


  # ── ورکر IP سوم ──────────────────────────────────────────────
  celery_worker_3:
    <<: *backend-common
    image: barpro_celery_worker_3:latest
    container_name: barpro-worker-3
    shm_size: '512m'
    mem_limit: 2.5g
    mem_reservation: 2g
    stop_grace_period: 10m
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - waybill_tasks_3,rpa_auth_3,rpa_submit_3,scheduled_tasks_3,rpa_scheduler,scheduled_tasks
      - --concurrency=1
      - -n
      - worker_3@%h
    environment:
      <<: *backend-env
      WORKER_ID: "3"
      WORKER_IP_INDEX: 3
      RPA_PROXIES: http://172.20.0.1:3130
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import sys; sys.exit(0)"']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3


  # ── زمان‌بند وظایف دوره‌ای ───────────────────────────────────
  celery_beat:
    <<: *backend-common
    image: barpro_celery_beat:latest
    container_name: barpro-beat
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      # pgrep is NOT available in the slim Python base image, so check for the
      # beat schedule file that Celery Beat writes at startup.
      test: ['CMD-SHELL', 'test -f /tmp/celerybeat-schedule || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
