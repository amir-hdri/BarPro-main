# ═══════════════════════════════════════════════════════════════
#  BarPro — Docker Compose Master File
#
#  ساختار لایه‌بندی شده برای مدیریت راحت‌تر و دیباگ دقیق‌تر:
#
#  لایه ۱ — زیرساخت (infra):    compose/infra.yml
#    └─ postgres, redis
#
#  لایه ۲ — پروکسی (proxy):     compose/proxy.yml
#    └─ squid_1 (Model B default); squid_2/3 only with --profile model-a
#
#  لایه ۳ — بک‌اند (backend):   compose/backend.yml
#    └─ backend API, celery_worker_1/2/3, celery_beat
#
#  لایه ۴ — فرانت‌اند (web):    compose/web.yml
#    └─ frontend (Next.js), nginx
#
#  لایه ۵ — مانیتورینگ (mon):   compose/monitoring.yml
#    └─ prometheus
#
#  اجرای کل پروژه در Model B (production/default):
#    bash manage.sh start
#
#  اجرای تک‌سروره Model A (سه Squid + سه worker محلی):
#    BARPRO_TOPOLOGY=model-a bash manage.sh start
#  یا مستقیماً با Compose:
#    docker compose --profile model-a --profile scale-out up -d
#
#  اجرای یک لایه مشخص برای دیباگ:
#    docker compose -f compose/infra.yml up
#    docker compose -f compose/backend.yml up
#    docker compose -f compose/web.yml up
# ═══════════════════════════════════════════════════════════════

include:
  - compose/infra.yml
  - compose/proxy.yml
  - compose/backend.yml
  - compose/web.yml
  - compose/monitoring.yml
